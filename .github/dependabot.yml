version: 2

updates:
  # App dependencies — grouped so minor/patch bumps arrive as one PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the CI actions themselves current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
