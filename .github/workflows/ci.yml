# Continuous Integration — quality gate for every push to `main` and every PR.
#
# Deployment itself is handled natively by Vercel's Git integration (see
# DEPLOYMENT.md): pushes to `main` ship a production build, PRs get preview
# URLs. This workflow is the gate that keeps broken code from reaching them.
#
# The pipeline runs on Node 24 to match the Vercel project's runtime.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ali-omar-abdelhady.vercel.app

      - name: Upload build for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: .next/**/*.log
          if-no-files-found: ignore
          retention-days: 7
